<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>HAPPY BIRTHDAY AMMA</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: "Segoe UI", Arial, sans-serif;
}


/* =========================
   FULL SCREEN PHOTO
========================= */

#photo {
    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    object-fit: contain;
    background: #000;
    z-index: 1;
}


/* =========================
   COUNTDOWN
========================= */

#countdown {

    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 1000;

    color: white;

    background: rgba(255, 255, 255, 0.15);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border: 1px solid rgba(255, 255, 255, 0.3);

    border-radius: 50px;

    padding: 14px 30px;

    font-size: 22px;

    font-weight: 600;

    letter-spacing: 1px;

    white-space: nowrap;

    text-align: center;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.5);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #countdown {

        bottom: 15px;

        padding: 10px 18px;

        font-size: 15px;

        max-width: calc(100vw - 20px);

    }

}


/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 380px) {

    #countdown {

        top: 12px;

        padding: 9px 14px;

        font-size: 13px;

    }

}

</style>

</head>


<body>


<!-- =========================
     COUNTDOWN
========================= -->

<div id="countdown">
    ⏳ Loading...
</div>


<!-- =========================
     ONE PHOTO
========================= -->

<img
    id="photo"
    src="1.jpg"
    alt="Birthday Photo"
>


<script>

/* =========================
   BIRTHDAY DATE
========================= */

/*
   28 September 2026
   12:00 AM
   India Time (IST)
*/

const target =
    new Date(
        "2026-09-28T18:00:00+05:30"
    ).getTime();


const countdown =
    document.getElementById(
        "countdown"
    );


let timerInterval;


function updateCountdown() {

    const now = Date.now();

    const difference =
        target - now;


    /* Birthday reached */

    if (difference <= 0) {

        countdown.innerHTML =
            "🎂 HAPPY BIRTHDAY AMMA! 🎉";

        clearInterval(timerInterval);

        return;
    }


    /* Calculate time */

    const days =
        Math.floor(
            difference / 86400000
        );


    const hours =
        Math.floor(
            (difference % 86400000)
            / 3600000
        );


    const minutes =
        Math.floor(
            (difference % 3600000)
            / 60000
        );


    const seconds =
        Math.floor(
            (difference % 60000)
            / 1000
        );


    /* Add 0 before single digits */

    const hrs =
        String(hours)
        .padStart(2, "0");


    const mins =
        String(minutes)
        .padStart(2, "0");


    const secs =
        String(seconds)
        .padStart(2, "0");


    /* Show countdown */

    countdown.innerHTML =
        `⏳ ${days}d : ${hrs}h : ${mins}m : ${secs}s`;

}


/* Start immediately */

updateCountdown();


/* Update every second */

timerInterval =
    setInterval(
        updateCountdown,
        1000
    );

</script>


</body>

</html>
